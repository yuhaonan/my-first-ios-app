name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: xcodebuild -project MyFirstApp.xcodeproj -scheme MyFirstApp -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/限免速查.app Payload/
          zip -r 限免速查-v1.2.ipa Payload

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: v1.2
          files: 限免速查-v1.2.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
